name: Build France Arabic M3U

on:
  push:
    paths:
      - 'tools/generate_playlist.py'
      - '.github/workflows/update-playlist.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate merged playlist
        run: python3 tools/generate_playlist.py
      - name: Commit generated playlist
        run: |
          if git diff --quiet -- france-maghreb.m3u; then
            echo "No playlist changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add france-maghreb.m3u
          git commit -m "Update merged France Arabic playlist"
          git push
