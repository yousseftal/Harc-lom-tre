name: Build France Arabic M3U

on:
  push:
    paths:
      - 'tools/generate_playlist.py'
      - 'tools/filter_language_variants.py'
      - 'tools/add_backups.py'
      - 'tools/legal_filter.py'
      - 'tools/add_verified_extras.py'
      - 'tools/add_tunisia_extras.py'
      - '.github/workflows/update-playlist.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate merged playlist
        run: python3 tools/generate_playlist.py
      - name: Remove non-French non-Arabic variants
        run: python3 tools/filter_language_variants.py
      - name: Add alternate backup streams
        run: python3 tools/add_backups.py
      - name: Remove private or rights-restricted stream URLs
        run: python3 tools/legal_filter.py
      - name: Test and add verified Maghreb Gulf extras
        run: python3 tools/add_verified_extras.py
      - name: Test and add verified Tunisia extras
        run: python3 tools/add_tunisia_extras.py
      - name: Final legal filter
        run: python3 tools/legal_filter.py
      - name: Commit generated playlist
        run: |
          if git diff --quiet -- france-maghreb.m3u; then
            echo "No playlist changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add france-maghreb.m3u
            git commit -m "Update playlist with tested public streams"
            git push
          fi
      - name: Purge jsDelivr cache
        run: |
          curl -fsSL "https://purge.jsdelivr.net/gh/yousseftal/Harc-lom-tre@main/france-maghreb.m3u" || true
